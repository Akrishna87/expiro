name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: expiro-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EXPIRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing EXPIRO_KEYSTORE_BASE64 secret (see README)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/expiro.jks"
      - name: Build signed release APK
        env:
          EXPIRO_KEYSTORE_PATH: ${{ runner.temp }}/expiro.jks
          EXPIRO_KEYSTORE_PASSWORD: ${{ secrets.EXPIRO_KEYSTORE_PASSWORD }}
          EXPIRO_KEY_ALIAS: ${{ secrets.EXPIRO_KEY_ALIAS }}
          EXPIRO_KEY_PASSWORD: ${{ secrets.EXPIRO_KEY_PASSWORD }}
          EXPIRO_VERSION_NAME: ${{ github.ref_name }}
          EXPIRO_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "expiro-${{ github.ref_name }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: expiro-${{ github.ref_name }}.apk
          generate_release_notes: true
