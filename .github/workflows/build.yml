name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Releases are tagged v<MAJOR_MINOR>.<run number>. Bump this for a bigger version change.
  MAJOR_MINOR: "0.3"

jobs:
  # Pull requests: just check that it builds.
  debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

  # Every push to main: build a signed APK and publish it as a new GitHub Release (tag created automatically).
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EXPIRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing EXPIRO_KEYSTORE_BASE64 secret (see README)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/expiro.jks"
      - name: Build signed release APK
        env:
          EXPIRO_KEYSTORE_PATH: ${{ runner.temp }}/expiro.jks
          EXPIRO_KEYSTORE_PASSWORD: ${{ secrets.EXPIRO_KEYSTORE_PASSWORD }}
          EXPIRO_KEY_ALIAS: ${{ secrets.EXPIRO_KEY_ALIAS }}
          EXPIRO_KEY_PASSWORD: ${{ secrets.EXPIRO_KEY_PASSWORD }}
          EXPIRO_VERSION_NAME: ${{ env.MAJOR_MINOR }}.${{ github.run_number }}
          EXPIRO_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.MAJOR_MINOR }}.${{ github.run_number }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk "expiro-$TAG.apk"
          gh release create "$TAG" "expiro-$TAG.apk" \
            --target "$GITHUB_SHA" --title "Expiro $TAG" --generate-notes --latest
